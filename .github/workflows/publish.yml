name: publish

# Publishes this package to the npm registry through trusted publishing (OIDC).
#
# No npm token is involved: npm detects the GitHub Actions environment, exchanges
# the job's OIDC identity token for a short-lived registry credential, and the
# registry matches it against the trusted publisher configured for this package
# (see the Releasing section of the README). The only requirement on this side is
# the `id-token: write` permission below.
#
# Started manually so a release is always an explicit act; add a tag trigger when
# you want releases to run themselves.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm publish` runs `prepack`, which runs the smoke suite, which imports
      # @deepseek-ai/dsh-tools. Without installing devDependencies that import
      # fails and the publish never starts.
      - name: Install dependencies
        run: npm ci

      # setup-node's registry-url writes an .npmrc auth line; remove it so the
      # publish is unambiguously authenticated by OIDC rather than by a token.
      - name: Drop any token auth written by setup-node
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            grep -v '_authToken' "$NPM_CONFIG_USERCONFIG" > "$NPM_CONFIG_USERCONFIG.tmp" || true
            mv "$NPM_CONFIG_USERCONFIG.tmp" "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Show what will be published
        run: |
          node -e "const p=require('./package.json');console.log(p.name+'@'+p.version)"
          ls -la

      # Trusted publishing needs an npm recent enough to perform the OIDC
      # exchange. The Node 20 image ships npm 10.x, which has no such support
      # and reports ENEEDAUTH instead of authenticating.
      - name: Use a recent npm
        run: npm install -g npm@latest

      # OIDC only works when the job is granted `id-token: write`; without it
      # ACTIONS_ID_TOKEN_REQUEST_URL is absent. Print the facts so a failure
      # names its cause instead of being guessed at.
      - name: Check the OIDC environment
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: present"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: MISSING - id-token: write was not granted"
          fi
          echo "npm version: $(npm --version)"

      - name: Publish
        run: npm publish --provenance --access public
